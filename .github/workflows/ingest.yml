name: Ingest feeds

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (GitHub may delay scheduled runs at busy times)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Pull feeds
        env:
          RL_ENABLED: ${{ vars.RL_ENABLED }}          # set to "true" only after licensing is cleared
          RL_API_BASE: ${{ vars.RL_API_BASE }}
          RL_API_KEY_HEADER: ${{ vars.RL_API_KEY_HEADER }}
          RL_API_KEY: ${{ secrets.RL_API_KEY }}
        run: python scripts/ingest.py

      - name: Build live flow (orb)
        env:
          RL_ENABLED: ${{ vars.RL_ENABLED }}
          RL_API_BASE: ${{ vars.RL_API_BASE }}
          RL_API_KEY_HEADER: ${{ vars.RL_API_KEY_HEADER }}
          RL_API_KEY: ${{ secrets.RL_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}       # optional; raises NVD rate limits
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}     # used only by the optional Upptime adapter
        run: python scripts/flow.py

      - name: Commit changes
        run: |
          if git diff --quiet -- site/data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "incident-monitor-bot"
          git config user.email "incident-monitor-bot@users.noreply.github.com"
          git add site/data
          git commit -m "data: feed update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
